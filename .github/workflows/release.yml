# The actions are pinned to the exact commit they were on.
#
# A version tag (`@v4`) can be **moved**: the people who own the action
# can point it at new code — and then the workflow runs that new code,
# with the repository's secrets, without anybody in this repository
# having changed a thing. The commit cannot move.
name: Release

# Tagging a version builds the desktop bundles and attaches them to the
# release. The build itself is the same script the maintainer runs locally,
# so the artifacts are reproducible from the tagged commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the build to'
        required: true
        default: 'v1.1.0'
      platform:
        description: 'Which build to run'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - macos
          - windows

jobs:
  macos-app:
    name: Build macOS app
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'macos'
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL 16
        run: brew install postgresql@16 || brew list postgresql@16

      - name: Build the DMG
        run: bash scripts/build-macos-app.sh

      - name: Attach the DMG to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The name of the disk image depends on the machine it was built
        # on — it was written down as arm64, so a build on an Intel
        # runner produced a file with another name and the upload failed.
        run: |
          DMG=$(ls build-macos/Mirrai-macOS-*.dmg | head -1)
          if [ -z "$DMG" ]; then echo "No .dmg was built." >&2; exit 1; fi
          # The checksum.
          #
          # There was none — so the person who downloaded the disk image
          # had no way of telling whether it was the one that was built,
          # or one that somebody else put in its place.
          shasum -a 256 "$DMG" > "$DMG.sha256"
          gh release upload "${{ inputs.tag || github.ref_name }}" "$DMG" "$DMG.sha256" --clobber

  windows-app:
    name: Build Windows app
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'windows'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Build the bundle
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          ./scripts/build-windows-app.ps1

      - name: Smoke test the bundle
        # The bundle is worth shipping even if the smoke test trips: a failure
        # here is a signal to investigate, not a reason to withhold the build.
        #
        # But it was *silent*: `continue-on-error: true` makes the step
        # green, so the release looked healthy while the app it points at
        # does not start. The failure is recorded, the build carries on,
        # and the job fails at the end — the installer is still attached to
        # the release, and the release is red, which is what a human needs
        # to see.
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          ./scripts/windows/smoke-test.ps1

      - name: Build the installer
        shell: pwsh
        run: |
          # Long paths are enabled on Windows 10 1607 and later by default, but
          # the compiler itself is not long-path aware.
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null
          $paths = @("$env:ProgramFiles\Inno Setup*\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe")
          $iscc = Get-ChildItem -Path $paths -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem -Path $paths -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup was not found." }
          # The version is the app's own, out of package.json — not a copy
          # in the installer script that goes stale the moment the app is
          # released.
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $version) { throw "The app's version could not be read from package.json." }
          # The GUI launcher is what the Start menu shortcut points at, and
          # it is built with the .NET SDK. If it is not there, the install
          # would have a shortcut that starts nothing.
          $launcher = Join-Path $PWD "build-windows\Mirrai-Windows-x64\Mirrai.exe"
          if (-not (Test-Path $launcher)) {
            throw "The GUI launcher is missing from the bundle ($launcher), so the installer's shortcut would point at nothing."
          }
          # Absolute paths, so that no ".." ends up in the middle of the file
          # names the compiler opens.
          & $iscc.FullName installer\installer.iss `
            "/DMyAppVersion=$version" `
            "/DMyAppBundle=$($PWD.Path)\build-windows\Mirrai-Windows-x64" `
            "/DMyAppOutputDir=$($PWD.Path)\build-windows" `
            "/DMyAppLicense=$($PWD.Path)\LICENSE"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }

      - name: Attach the installer to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The checksum.
          #
          # There was none — so the person who downloaded the installer
          # had no way of telling whether it was the one that was built,
          # or one that somebody else put in its place.
          $installer = "build-windows/Mirrai-Setup-x64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          "$hash  Mirrai-Setup-x64.exe" | Set-Content -Encoding ascii "build-windows/Mirrai-Setup-x64.exe.sha256"
          gh release upload "${{ inputs.tag || github.ref_name }}" $installer "build-windows/Mirrai-Setup-x64.exe.sha256" --clobber

      - name: The smoke test tripped
        # The job goes red, and the installer is already attached — so
        # the failure can be investigated, and the release cannot be
        # mistaken for a healthy one.
        if: steps.smoke.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Error "The Windows bundle did not pass its smoke test. The installer has been attached so that the failure can be investigated, but this release is not a healthy one."
          exit 1
