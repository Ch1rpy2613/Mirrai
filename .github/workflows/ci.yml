# The actions are pinned to the exact commit they were on.
#
# A version tag (`@v4`) can be **moved**: the people who own the action
# can point it at new code — and then the workflow runs that new code,
# with the repository's secrets, without anybody in this repository
# having changed a thing. The commit cannot move.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

  schema:
    name: Schema check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mirrai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mirrai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `drizzle-kit push` is used rather than `generate && migrate`: the
      # migration journal lives in `drizzle/meta/`, which is gitignored, so
      # `migrate` cannot work on a fresh checkout.
      - name: Apply schema
        run: pnpm exec drizzle-kit push --force

      - name: Verify the schema is in sync
        run: |
          output="$(pnpm exec drizzle-kit push 2>&1)"
          echo "$output"
          if echo "$output" | grep -qiE "no changes|up to date|already in sync|nothing to migrate"; then
            echo "schema.ts matches the database"
          else
            echo "::error::drizzle/schema.ts does not match the database state"
            exit 1
          fi

      # The hand-written migrations must be idempotent — re-running them
      # against an already-migrated database has to be a no-op.
      - name: Verify the SQL migrations are idempotent
        run: |
          pnpm db:migrate
          pnpm db:migrate
