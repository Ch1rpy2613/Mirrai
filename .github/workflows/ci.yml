# The actions are pinned to the exact commit they were on.
#
# A version tag (`@v4`) can be **moved**: the people who own the action
# can point it at new code — and then the workflow runs that new code,
# with the repository's secrets, without anybody in this repository
# having changed a thing. The commit cannot move.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    # The database is here for the tests that need one.
    #
    # Two test files are about what the *database* refuses to do — the
    # unique index that stops the same sentence being stored twice, and
    # the key that stops the same message being collected twice. They
    # are skipped when there is no database, and they used to be
    # skipped here: this job had no database of its own, and the
    # postgres service belonged to the separate schema job, which
    # never runs the tests.
    #
    # So the two guarantees the database is there to provide were
    # green by skipping — on the machine that has a database, and only
    # on that machine.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mirrai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mirrai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      # The schema, before the tests.
      #
      # The tests that talk to the database need the tables to be
      # there. The schema is built from `drizzle/schema.ts` — the same
      # way a fresh install builds it.
      - name: Apply schema
        run: pnpm exec drizzle-kit push --force

      - name: Test
        run: pnpm test

  schema:
    name: Schema check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mirrai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mirrai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `drizzle-kit push` is used rather than `generate && migrate`: the
      # migration journal lives in `drizzle/meta/`, which is gitignored, so
      # `migrate` cannot work on a fresh checkout.
      #
      # The two paths have to end up with the same schema: a fresh install
      # builds it from `drizzle/schema.ts`, and an existing install applies
      # the hand-written SQL files. So the SQL files are applied *on top of*
      # the schema built from `schema.ts` — and the schema is then checked
      # against `schema.ts` again.
      #
      # It used to be checked before the SQL files ran, so the database was
      # compared with the thing it had just been built from: it could not
      # fail, and the one thing worth checking — that the two paths agree —
      # was never checked.
      - name: Apply schema
        run: pnpm exec drizzle-kit push --force

      - name: Apply the SQL migrations on top of it
        run: pnpm db:migrate

      - name: Verify the schema is in sync
        run: |
          output="$(pnpm exec drizzle-kit push 2>&1)"
          echo "$output"
          if echo "$output" | grep -qiE "no changes|up to date|already in sync|nothing to migrate"; then
            echo "schema.ts matches the database"
          else
            echo "::error::drizzle/schema.ts does not match the database state"
            exit 1
          fi

      # The hand-written migrations must be idempotent — re-running them
      # against an already-migrated database has to be a no-op.
      #
      # It used to run the script twice, which was not a test of that at
      # all: the second run read the journal, saw the work was done, and
      # did nothing. The claim is about the SQL, so the SQL is what runs
      # again — `--replay` ignores the journal and re-runs every file.
      - name: Verify the SQL migrations are idempotent
        run: pnpm db:replay
