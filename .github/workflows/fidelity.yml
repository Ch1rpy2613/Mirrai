# The actions are pinned to the exact commit they were on.
#
# A version tag (`@v4`) can be **moved**: the people who own the action
# can point it at new code — and then the workflow runs that new code,
# with the repository's secrets, without anybody in this repository
# having changed a thing. The commit cannot move.
name: Persona structure

# The gate that can actually gate.
#
# The third phase built a ruler: one of the person's real lines is held
# back, and the rebuilt persona has to say it again, and the numbers are
# compared with the last run's. That measurement is the honest one — and
# it is also *sampled*, so two runs of an unchanged persona differ by
# more than the gate's tolerance about 42% of the time.
#
# A gate that cries wolf that often does not gate anything. So this job
# checks the things that are *decided* rather than sampled: that the
# rules are in the prompt as a hard constraint and in the right place,
# that an unconfirmed candidate never reaches the prompt, that the
# imperfection follows the state the prompt states, that the persona's
# data survives the round trip through the database's jsonb, and that
# Layer 0 still says the persona cannot carry a message out of the app.
#
# None of that costs a model call, none of it needs the person's
# records, and none of it has a distribution. It runs in a second and
# it is the same answer every time.
#
# The fidelity measurement is not thrown away — it is moved to where it
# can be run honestly, on the person's own machine, against their own
# records:
#
#     pnpm eval -- --persona 1 --user 1 --compare
#
# and its numbers are written into docs/eval/baseline.md for a human to
# read.
on:
  pull_request:
    paths:
      - "server/_core/persona-*.ts"
      - "server/chat/prompt.ts"
      - "server/chat/service.ts"
      - "server/chat/farewell*.ts"
      - "server/chat/outbound.ts"
      - "server/skill-engine/**"
      - "shared/micro-rules.ts"
      - "shared/imperfection.ts"
      - "shared/copy/prompt.ts"
      - "drizzle/schema.ts"
      - "scripts/fidelity-gate.ts"
  push:
    branches: [main]
    paths:
      - "server/_core/persona-*.ts"
      - "server/chat/prompt.ts"
      - "server/chat/service.ts"
      - "server/chat/farewell*.ts"
      - "server/chat/outbound.ts"
      - "server/skill-engine/**"
      - "shared/micro-rules.ts"
      - "shared/imperfection.ts"
      - "shared/copy/prompt.ts"
      - "drizzle/schema.ts"
      - "scripts/fidelity-gate.ts"
  workflow_dispatch:

jobs:
  structure:
    name: Does the persona still have everything it needs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the persona's structure
        run: pnpm fidelity:gate
