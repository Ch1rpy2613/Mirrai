# What CodeQL looks at.
#
# The default suite is kept — only the paths are narrowed, because a
# file that is not shipped cannot be a hole in the shipped thing.
#
# The tests are full of routes, handlers and servers that are stood up
# for a moment to show that something is refused. CodeQL reads them as
# endpoints that answer to the world: one of them stood up a route in
# a test and was reported as "missing rate limiting" for it.
name: "CodeQL config"

# The queries to leave out.
#
# The key is `query-filters`, and it is the CLI's own name for it.
query-filters:
  # The rule that cannot work here.
  #
  # `js/missing-rate-limiting` recognises five rate limiters and no
  # others: `express-rate-limit`, `express-brute`, `express-limiter`,
  # `rate-limiter-flexible` and `fastify-rate-limit`. This app has its
  # own limiter — keyed by the user for the model calls and by the
  # address for the sign-in, kept in the database so it holds across
  # restarts — so the rule cannot see it, and it reports *every* route
  # as unlimited.
  #
  # That is a false positive on every single route, and a rule that
  # cries wolf on every route is a rule nobody reads. The protection
  # itself is real and is tested: `server/_core/rate-limit.test.ts`.
  #
  # The rule is left out rather than the limit removed.
  - exclude:
      id: js/missing-rate-limiting
  #
  # The rule about the old password hash.
  #
  # It is right about the hash — SHA-256 is fast, and a stolen copy of
  # an old hash can be tried against far too many guesses. But the
  # accounts that carry an old hash are real people's accounts: the old
  # format has to stay *readable* or every one of them is locked out of
  # their own history on the day the app was updated.
  #
  # So the old format is read and never written: a password that
  # arrives against an old hash is written again with scrypt the moment
  # it matches — see `needsRehash` and the sign-in path. An old hash
  # lives only until the account's owner next signs in.
  #
  # The rule is left out because it cannot tell the difference between
  # "this code hashes a password with something cheap" and "this code
  # reads a hash that was made with something cheap, once, years ago".
  #
  # So something else watches it: `server/password-hash-policy.test.ts`
  # reads every file in the server and says that the only place a weak
  # hash may appear is the one legacy function. A new weak hash fails
  # the test.
  - exclude:
      id: js/insufficient-password-hash

paths-ignore:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.test.mjs"
  - "**/*.test.js"
  - "**/tests/**"
  - "**/test/**"
  - "**/__tests__/**"
